name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          mkdir -p "$ANDROID_HOME/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf 'd56f5187479451be83f24699555245263af67003\n' > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$STORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            printf '%s\n' \
              "storeFile=$GITHUB_WORKSPACE/release.jks" \
              "keyAlias=$KEY_ALIAS" \
              "storePassword=$STORE_PASSWORD" \
              >> local.properties
          fi

      - name: Build release APKs
        run: bash gradlew assembleRelease

      - name: Write update metadata
        id: ver
        run: |
          name=$(sed -n 's/.*versionName *"\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          code=$(sed -n 's/.*versionCode *\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$name"
          fi
          mkdir -p Release/apk
          for mode in leanback mobile; do
            printf '%s\n' "{\"name\":\"$name\",\"desc\":\"\",\"code\":$code}" > "Release/apk/${mode}.json"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: Release/apk/*
